name: probe
on:
  push:
    branches: ['probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            torch: "1.13.0"
            torchvision: "0.14.0"
          - python: "3.11"
            torch: "2.0.0"
            torchvision: "0.15.0"
    steps:
      - uses: actions/checkout@v7
      - uses: ultralytics/actions/setup-uv@main
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv pip install -e ".[export-base,export-legacy-torch]" torch==${{ matrix.torch }} torchvision==${{ matrix.torchvision }} --torch-backend cpu
      - run: |
          for mode in predictor raw freeze; do
            PYTHONUNBUFFERED=1 python probe_ts.py $mode > out_$mode.txt 2>&1 || echo "exit=$?"
            grep -vE "Warning|warn" out_$mode.txt | tail -25
          done
